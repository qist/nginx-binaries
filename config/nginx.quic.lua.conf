# nginx 配置: QUIC(HTTP/3) + TLS1.3(后量子混合组) + LuaJIT + lua-resty 生态 + qist/waf
#
# 使用前请把 LUA_ROOT 替换为本机 build-libs.sh 产出的纯 lua 生态根目录
#   (默认: <仓库>/work/lua)
# 以及 LUAJIT_SHARE 替换为 <仓库>/work/luajit/usr/local/share/lua/5.1
#
# worker 共享内存 (WAF 用)
lua_shared_dict limit    100m;
lua_shared_dict badGuys  100m;
lua_shared_dict waf_cache 10m;
lua_code_cache on;
lua_need_request_body on;

# lua 模块搜索顺序: waf 目录优先(命中 config/lib/init/access), 其次纯 lua 生态根, 再 LuaJIT share
lua_package_path "<LUA_ROOT>/waf/?.lua;<LUA_ROOT>/?.lua;<LUA_ROOT>/?/init.lua;<LUAJIT_SHARE>/?.lua;;";

# WAF 初始化 (master 进程启动时预加载 config/lib)
init_by_lua_file <LUA_ROOT>/waf/init.lua;

worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /tmp/error.log;

events {
    worker_connections 1024;
}

http {
    # WAF 模块搜索路径在 http 块也要声明 (部分版本要求)
    lua_package_path "<LUA_ROOT>/waf/?.lua;<LUA_ROOT>/?.lua;<LUA_ROOT>/?/init.lua;<LUAJIT_SHARE>/?.lua;;";

    server {
        listen 443 quic reuseport;
        listen 443 ssl;
        http3 on;

        ssl_certificate     /root/nginx-build/certs/cert.pem;
        ssl_certificate_key /root/nginx-build/certs/key.pem;

        ssl_protocols TLSv1.3;
        # 后量子混合组 (OpenSSL 3.6 原生支持)
        ssl_ecdh_curve X25519MLKEM768:SecP384r1MLKEM1024:SecP256r1MLKEM768:X25519:P-384:P-256;

        # WAF 在 access 阶段拦截 (全局)
        access_by_lua_file <LUA_ROOT>/waf/access.lua;

        location / {
            return 200 "hello quic+oqs\n";
        }

        location /lua {
            content_by_lua_block {
                ngx.say("lua ok")
            }
        }

        # 纯 lua cjson 垫片 (dkjson) 验证
        location /json {
            content_by_lua_block {
                local cjson = require("cjson")
                ngx.say(cjson.encode({hello = "world", q = 1}))
            }
        }
    }
}
