name: Auto Build Nginx Multi-Platform

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨检查
  workflow_dispatch:
    inputs:
      version:
        description: 'Nginx version to build (e.g., 1.31.1)'
        required: false
        default: ''
      force_build:
        description: 'Force rebuild even if tag v<version> already exists (keeps tag, overwrites release assets)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check for new nginx version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest nginx release from GitHub
        id: get-nginx-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            LATEST_TAG="release-${{ github.event.inputs.version }}"
          else
            # 使用 releases/latest API 获取最新稳定版本
            LATEST_TAG=$(curl -s https://api.github.com/repos/nginx/nginx/releases/latest | jq -r '.tag_name')
          fi
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Error: Failed to get latest nginx version"
            exit 1
          fi
          
          echo "latest_nginx_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest nginx tag: $LATEST_TAG"

      - name: Check if we already have this version
        id: check
        run: |
          LATEST_TAG=${{ steps.get-nginx-version.outputs.latest_nginx_tag }}
          VERSION=$(echo $LATEST_TAG | sed 's/release-//')
          FORCE="${{ github.event.inputs.force_build }}"

          if [ "$FORCE" = "true" ]; then
            # 强制构建: 不删除已有 tag, 直接重建并覆盖 release 产物
            echo "Force build enabled: rebuilding $VERSION (existing tag v$VERSION is kept)"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif git tag | grep -q "v$VERSION"; then
            echo "Version $VERSION already exists, skipping build"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION found, starting build"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build nginx ${{ needs.check-version.outputs.new_version }} ${{ matrix.os }} ${{ matrix.arch }}
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CentOS 7 (glibc) amd64 - 原生 x86 容器
          - os: centos7
            arch: amd64
            runs-on: ubuntu-latest
            suffix: glibc_amd64
            use-docker: true
            docker-image: centos:7.9.2009

          # CentOS 7 (glibc) arm64 - 原生 arm64 容器 (GitHub ARM runner, 无 QEMU/交叉编译)
          - os: centos7
            arch: arm64
            runs-on: ubuntu-24.04-arm
            suffix: glibc_arm64
            use-docker: true
            docker-image: centos:7.9.2009

          # Alpine amd64 (musl)
          - os: alpine
            arch: amd64
            runs-on: ubuntu-latest
            suffix: musl_amd64
            use-docker: true
            docker-image: alpine:3.20

          # Alpine arm64 (musl)
          - os: alpine
            arch: arm64
            runs-on: ubuntu-24.04-arm
            suffix: musl_arm64
            use-docker: true
            docker-image: alpine:3.20

          # macOS amd64 (Intel - 使用原生 intel 运行器)
          - os: macos
            arch: amd64
            runs-on: macos-15-intel
            suffix: macos_amd64

          # macOS arm64 (原生 Apple Silicon)
          - os: macos
            arch: arm64
            runs-on: macos-15
            suffix: macos_arm64

          # Windows amd64
          - os: windows
            arch: amd64
            runs-on: windows-latest
            suffix: windows_amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker Buildx
        if: matrix.use-docker
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker (CentOS 7)
        if: matrix.use-docker && matrix.os == 'centos7'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          docker run --rm --platform linux/${{ matrix.arch }} -v $PWD:/workspace -w /workspace -e GITHUB_TOKEN ${{ matrix.docker-image }} \
            bash -c "set -ex
            # 安装官方 vault 归档源 + SCL(devtoolset-9)
            # arm64 源在 altarch 路径下, x86_64 在常规路径 (Actions 表达式直接拼 URL, 避免变量被外层 shell 展开)
            cat > /etc/yum.repos.d/CentOS-Base.repo <<EOF
          [base]
          name=CentOS-7.9.2009 - Base
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/os/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/
          gpgcheck=0
          enabled=1
          [updates]
          name=CentOS-7.9.2009 - Updates
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/updates/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/
          gpgcheck=0
          enabled=1
          [extras]
          name=CentOS-7.9.2009 - Extras
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/extras/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/
          gpgcheck=0
          enabled=1
          [sclo-rh]
          name=CentOS-7.9.2009 - SCLo-rh
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/sclo/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/rh/
          gpgcheck=0
          enabled=1
          EOF
          yum install -y gcc gcc-c++ make git patch perl perl-IPC-Cmd perl-Time-Piece autoconf automake libtool \
            devtoolset-9-gcc devtoolset-9-gcc-c++ devtoolset-9-binutils \
            xz pkgconfig curl file
          # 启用 devtoolset-9 (gcc 9)
          source /opt/rh/devtoolset-9/enable
          # CentOS 7 官方源无 cmake3(EPEL 已 EOL), 改用 Kitware 预编译 cmake 3.27
          # (xz/libxslt/brotli/mimalloc 均要求 >=3.20)。按架构选包, 软链到 /usr/local/bin/cmake。
          CMAKE_ARCH=${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          curl -sL -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-linux-\${CMAKE_ARCH}.tar.gz
          tar xzf /tmp/cmake.tar.gz -C /tmp
          ln -sf /tmp/cmake-3.27.9-linux-\${CMAKE_ARCH}/bin/cmake /usr/local/bin/cmake
          cmake --version | head -1
          MODULE_ROOT=/workspace LIBS_PREFIX=/workspace/libs \
            bash /workspace/scripts/ci-build.sh /workspace $VERSION ${{ matrix.suffix }} tar.gz"

      - name: Build with Docker (Alpine)
        if: matrix.use-docker && matrix.os == 'alpine'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          docker run --rm --platform linux/${{ matrix.arch }} -v $PWD:/workspace -w /workspace -e GITHUB_TOKEN ${{ matrix.docker-image }} \
            sh -c "set -ex && apk update && apk add build-base git patch perl autoconf automake libtool cmake pkgconfig linux-headers curl xz bash sed coreutils &&
            MODULE_ROOT=/workspace LIBS_PREFIX=/workspace/libs bash /workspace/scripts/ci-build.sh /workspace $VERSION ${{ matrix.suffix }} tar.gz"
            # 注: 必须装 GNU coreutils(cat -s) + GNU sed (Alpine 默认 busybox 不支持)。
            # ngx_devel_kit 的 auto/build 用 cat -s 读数据文件、GNU sed 扩展正则生成
            # ndk_palloc.h 等头文件; busybox cat -s 静默失败导致整段宏缺失,
            # set-misc 等模块链接时报 ndk_palloc_re undefined reference。

      - name: Build macOS
        if: matrix.os == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          brew install pcre zlib cmake pkg-config autoconf automake libtool
          cd $GITHUB_WORKSPACE
          MODULE_ROOT=$GITHUB_WORKSPACE LIBS_PREFIX=$GITHUB_WORKSPACE/libs \
            bash scripts/ci-build.sh $GITHUB_WORKSPACE $VERSION ${{ matrix.suffix }} tar.gz

      - name: Setup MSYS2 UCRT64
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-libtool
            autoconf
            automake
            git
            patch
            zip
            perl
            nasm

      - name: Build Windows
        if: matrix.os == 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: msys2 {0}
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          # 创建 mingw32-make 的别名 make
          ln -sf /ucrt64/bin/mingw32-make.exe /ucrt64/bin/make.exe
          # openssl 版本策略: 跟随 3.5 LTS 分支最新 patch 自动累加 (LTS 支持到 2030-04);
          # 4.x 不跟随 (CVE-2026-121481 影响 4.0.x/4.1.0), 3.6 系列 EOL; API 异常兜底 3.5.9
          OPENSSL_TAG=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/openssl/openssl/releases?per_page=100" \
            | sed -n 's/.*"tag_name":[[:space:]]*"\(openssl-3\.5\.[0-9][0-9]*\)".*/\1/p' | head -1)
          [ -n "$OPENSSL_TAG" ] || OPENSSL_TAG=openssl-3.5.9
          echo "==> Windows 构建 openssl: $OPENSSL_TAG"
          git clone --depth=1 --recursive -b "$OPENSSL_TAG" https://github.com/openssl/openssl.git
          git clone --depth=1 -b release-$VERSION https://github.com/nginx/nginx.git

          # 应用 stream pp-var 补丁 (纯 C 平台无关; 行为由 Linux smoke-patch job 端到端覆盖)
          patch -p1 --fuzz=0 -d nginx < patches/nginx-stream-pp-var.patch \
            || { echo "!! pp-var 补丁应用失败"; exit 1; }
          echo "==> stream pp-var 补丁已应用 (Windows)"

          # Lua 支持: LuaJIT (mingw 构建) + lua-nginx-module; 生态为纯 lua 文件拷贝
          git clone --depth=1 https://github.com/openresty/luajit2.git
          git clone --depth=1 https://github.com/openresty/lua-nginx-module.git

          git clone --depth=1 --recursive https://github.com/simplresty/ngx_devel_kit.git
          git clone --depth=1 --recursive https://github.com/openresty/set-misc-nginx-module.git
          git clone --depth=1 --recursive https://github.com/yaoweibin/ngx_http_substitutions_filter_module.git
          git clone --depth=1 --recursive https://github.com/atomx/nginx-http-auth-digest.git
          git clone --depth=1 --recursive https://github.com/openresty/headers-more-nginx-module.git
          git clone --depth=1 --recursive https://github.com/aperezdc/ngx-fancyindex.git
          git clone --depth=1 --recursive -b pcre2-10.42 https://github.com/PCRE2Project/pcre2.git
          git clone --depth=1 --recursive -b v1.3.2 https://github.com/madler/zlib.git

          # 构建 LuaJIT (openresty fork 无 msysbuild.bat, 用 src/Makefile 显式 Windows 目标)
          # Windows 分支的 GIT_RELVER 是 cmd 语法, msys2 的 make 走 sh 会报语法错:
          # 替换为 no-op 并预先用 git 生成 luajit_relver.txt 供 genversion.lua 读取
          sed -i 's|GIT_RELVER= if exist .*|GIT_RELVER= :|' luajit2/src/Makefile
          git -C luajit2 show -s --format=%ct > luajit2/src/luajit_relver.txt
          echo "==> 构建 LuaJIT (mingw)"
          make -C luajit2/src -j"$(nproc)" \
            CC=gcc HOST_CC=gcc TARGET_SYS=Windows HOST_SYS=Windows

          # 纯 lua 生态 (resty-*/dkjson/cjson 垫片/socket 桥/waf, 与 Linux 包同一脚本)
          bash scripts/install-lua-ecosystem.sh "$PWD/lua"

          cd pcre2
          ./autogen.sh
          cd ../nginx
          export LUAJIT_LIB=../luajit2/src LUAJIT_INC=../luajit2/src
          ./auto/configure \
            --with-cc=gcc \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --http-scgi-temp-path=temp/scgi_temp \
            --http-uwsgi-temp-path=temp/uwsgi_temp \
            --with-compat \
            --with-pcre=../pcre2 \
            --with-pcre-jit \
            --with-zlib=../zlib \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_realip_module \
            --with-http_auth_request_module \
            --with-http_addition_module \
            --with-http_gzip_static_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-stream \
            --with-debug \
            --with-stream_ssl_module \
            --with-stream_realip_module \
            --with-stream_ssl_preread_module \
            --with-http_secure_link_module \
            --with-http_gunzip_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_slice_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-openssl-opt=enable-tls1_3 \
            --with-openssl=../openssl \
            --with-openssl-opt='no-asm no-tests -D_WIN32_WINNT=0x0501' \
            --with-cc-opt="-I/ucrt64/include -I/ucrt64/include/libxml2 -I/ucrt64/include/libxslt -DFD_SETSIZE=32768" \
            --with-ld-opt="-L/ucrt64/lib" \
            --add-module=../ngx_devel_kit \
            --add-module=../set-misc-nginx-module \
            --add-module=../ngx_http_substitutions_filter_module \
            --add-module=../nginx-http-auth-digest \
            --add-module=../headers-more-nginx-module \
            --add-module=../ngx-fancyindex \
            --add-module=../lua-nginx-module
          mingw32-make -j$(nproc)
          # mingw32-make install
          # 修复 Windows 可执行文件扩展名
           mkdir -p /tmp/nginx
          if [ -f objs/nginx.exe ]; then
            \cp objs/nginx.exe /tmp/nginx/nginx.exe
          fi
           \cp -pdr conf /tmp/nginx/
           \cp -pdr docs/html /tmp/nginx/
          mkdir -p /tmp/nginx/logs
          mkdir -p /tmp/nginx/temp/client_body_temp
          mkdir -p /tmp/nginx/temp/proxy_temp
          mkdir -p /tmp/nginx/temp/fastcgi_temp
          mkdir -p /tmp/nginx/temp/scgi_temp
          mkdir -p /tmp/nginx/temp/uwsgi_temp
          # lua 生态 + LuaJIT 运行时 (布局与 Linux 包一致: lua/ + luajit-share/)
          cd "$GITHUB_WORKSPACE"
          cp -r lua /tmp/nginx/lua
          mkdir -p /tmp/nginx/luajit-share/lua/5.1
          cp -r luajit2/src/jit /tmp/nginx/luajit-share/lua/5.1/jit
          cp luajit2/src/lua51.dll /tmp/nginx/lua51.dll
          cp config/nginx.quic.lua.conf /tmp/nginx/conf/nginx.quic.lua.conf 2>/dev/null || true
          ls /tmp/nginx/
          cd /tmp
          zip -r $GITHUB_WORKSPACE/nginx_${VERSION}_${{ matrix.suffix }}.zip nginx/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx_${{ needs.check-version.outputs.new_version }}_${{ matrix.suffix }}
          path: nginx_${{ needs.check-version.outputs.new_version }}_${{ matrix.suffix }}.*

  # ── 补丁功能冒烟：用最小构建（仅 stream）验证 proxy_protocol 变量 ----------
  # 打包产物带 lua/mimalloc 等大量模块，在 runner 上未必能启动（与补丁无关），
  # 因此这里单独从同一份源码+同一个补丁编译一个最小 nginx 做端到端断言：
  #   v2 / v1 / off、字面量、next_upstream 重试缓存、SNI map、proxy_ssl 顺序、非法值。
  smoke-patch:
    name: Smoke test (stream pp-var patch)
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build minimal nginx with patch
        run: |
          set -eux
          VERSION=${{ needs.check-version.outputs.new_version }}
          curl -fsSL -o nginx.tar.gz "https://nginx.org/download/nginx-$VERSION.tar.gz"
          tar xzf nginx.tar.gz
          bash scripts/apply-nginx-patches.sh "nginx-$VERSION" "$VERSION"
          cd "nginx-$VERSION"
          ./configure --prefix="$PWD/../run" \
            --with-stream --with-stream_ssl_module --with-stream_ssl_preread_module \
            --without-http_rewrite_module --without-http_gzip_module
          make -j"$(nproc)"
          ../tests/stream_pp_var.sh "$PWD/objs/nginx"

  release:
    name: Create Release
    needs: [check-version, build, smoke-patch]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nginx_${{ needs.check-version.outputs.new_version }}_*

      - name: Remove existing release assets (force rebuild)
        if: github.event.inputs.force_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.check-version.outputs.new_version }}"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists, removing assets of version ${{ needs.check-version.outputs.new_version }}"
            gh api "repos/$REPO/releases/tags/$TAG" \
              --jq '.assets[] | select(.name | startswith("nginx_${{ needs.check-version.outputs.new_version }}_")) | .name' \
              | while read -r asset; do
                  [ -z "$asset" ] && continue
                  echo "  deleting asset: $asset"
                  gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
                done
          else
            echo "Release $TAG not found, nothing to remove"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Nginx ${{ needs.check-version.outputs.new_version }}
          body: |
            Auto-built nginx ${{ needs.check-version.outputs.new_version }} binaries for multiple platforms.
            
            ## Included Modules
            - HTTP/3 (QUIC) support via OpenSSL (version resolved at build time, pinned per security policy — see build log; Windows excluded) + nginx native HTTP/3 module
            - Lua scripting (LuaJIT + lua-nginx-module + resty-* ecosystem + cjson/dkjson shims + qist/waf)
            - Headers more
            - VTS (Virtual host traffic status)
            - And more...
            
            ## Platforms
            - Linux / glibc (amd64, arm64) — 在 CentOS 7 (glibc 2.17) 上构建, 除 glibc 外所有依赖 (OpenSSL/PCRE2/zlib/libxml2 等) 均静态链入, 因此可运行于任何 glibc 发行版 (RHEL/CentOS/Ubuntu/Debian 等及任意更新版本)
            - Alpine / musl (amd64, arm64)
            - macOS (amd64, arm64)
            - Windows (amd64) — no HTTP/3 (QUIC)
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
