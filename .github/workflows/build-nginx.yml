name: Auto Build Nginx Multi-Platform

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨检查
  workflow_dispatch:
    inputs:
      version:
        description: 'Nginx version to build (e.g., 1.31.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-version:
    name: Check for new nginx version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest nginx release from GitHub
        id: get-nginx-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            LATEST_TAG="release-${{ github.event.inputs.version }}"
          else
            # 使用 releases/latest API 获取最新稳定版本
            LATEST_TAG=$(curl -s https://api.github.com/repos/nginx/nginx/releases/latest | jq -r '.tag_name')
          fi
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Error: Failed to get latest nginx version"
            exit 1
          fi
          
          echo "latest_nginx_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest nginx tag: $LATEST_TAG"

      - name: Check if we already have this version
        id: check
        run: |
          LATEST_TAG=${{ steps.get-nginx-version.outputs.latest_nginx_tag }}
          VERSION=$(echo $LATEST_TAG | sed 's/release-//')
          
          if git tag | grep -q "v$VERSION"; then
            echo "Version $VERSION already exists, skipping build"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION found, starting build"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build nginx ${{ needs.check-version.outputs.new_version }} ${{ matrix.os }} ${{ matrix.arch }}
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CentOS 7 (glibc) amd64 - 原生 x86 容器
          - os: centos7
            arch: amd64
            runs-on: ubuntu-latest
            suffix: glibc_amd64
            use-docker: true
            docker-image: centos:7.9.2009

          # CentOS 7 (glibc) arm64 - 原生 arm64 容器 (GitHub ARM runner, 无 QEMU/交叉编译)
          - os: centos7
            arch: arm64
            runs-on: ubuntu-24.04-arm
            suffix: glibc_arm64
            use-docker: true
            docker-image: centos:7.9.2009

          # Alpine amd64 (musl)
          - os: alpine
            arch: amd64
            runs-on: ubuntu-latest
            suffix: musl_amd64
            use-docker: true
            docker-image: alpine:3.20

          # Alpine arm64 (musl)
          - os: alpine
            arch: arm64
            runs-on: ubuntu-24.04-arm
            suffix: musl_arm64
            use-docker: true
            docker-image: alpine:3.20

          # macOS amd64 (Intel - 使用原生 intel 运行器)
          - os: macos
            arch: amd64
            runs-on: macos-15-intel
            suffix: macos_amd64

          # macOS arm64 (原生 Apple Silicon)
          - os: macos
            arch: arm64
            runs-on: macos-15
            suffix: macos_arm64

          # Windows amd64
          - os: windows
            arch: amd64
            runs-on: windows-latest
            suffix: windows_amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker Buildx
        if: matrix.use-docker
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker (CentOS 7)
        if: matrix.use-docker && matrix.os == 'centos7'
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          docker run --rm --platform linux/${{ matrix.arch }} -v $PWD:/workspace -w /workspace ${{ matrix.docker-image }} \
            bash -c "set -ex
            # 安装官方 vault 归档源 + SCL(devtoolset-9)
            # arm64 源在 altarch 路径下, x86_64 在常规路径 (Actions 表达式直接拼 URL, 避免变量被外层 shell 展开)
            cat > /etc/yum.repos.d/CentOS-Base.repo <<EOF
          [base]
          name=CentOS-7.9.2009 - Base
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/os/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/
          gpgcheck=0
          enabled=1
          [updates]
          name=CentOS-7.9.2009 - Updates
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/updates/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/
          gpgcheck=0
          enabled=1
          [extras]
          name=CentOS-7.9.2009 - Extras
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/extras/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/
          gpgcheck=0
          enabled=1
          [sclo-rh]
          name=CentOS-7.9.2009 - SCLo-rh
          baseurl=https://vault.centos.org${{ matrix.arch == 'arm64' && '/altarch' || '' }}/7.9.2009/sclo/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}/rh/
          gpgcheck=0
          enabled=1
          EOF
          yum install -y gcc gcc-c++ make git patch perl perl-IPC-Cmd autoconf automake libtool \
            devtoolset-9-gcc devtoolset-9-gcc-c++ devtoolset-9-binutils \
            xz cmake3 pkgconfig curl file
          # 启用 devtoolset-9 (gcc 9) 并让 cmake 指向 cmake3
          source /opt/rh/devtoolset-9/enable
          ln -sf \$(command -v cmake3 || command -v cmake) /usr/local/bin/cmake
          MODULE_ROOT=/workspace LIBS_PREFIX=/workspace/libs \
            bash /workspace/scripts/ci-build.sh /workspace $VERSION ${{ matrix.suffix }} tar.gz"

      - name: Build with Docker (Alpine)
        if: matrix.use-docker && matrix.os == 'alpine'
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          docker run --rm --platform linux/${{ matrix.arch }} -v $PWD:/workspace -w /workspace ${{ matrix.docker-image }} \
            sh -c "set -ex && apk update && apk add build-base git patch perl autoconf automake libtool cmake pkgconfig linux-headers curl xz bash &&
            MODULE_ROOT=/workspace LIBS_PREFIX=/workspace/libs bash /workspace/scripts/ci-build.sh /workspace $VERSION ${{ matrix.suffix }} tar.gz"

      - name: Build macOS
        if: matrix.os == 'macos'
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          brew install pcre zlib cmake pkg-config autoconf automake libtool
          cd $GITHUB_WORKSPACE
          MODULE_ROOT=$GITHUB_WORKSPACE LIBS_PREFIX=$GITHUB_WORKSPACE/libs \
            bash scripts/ci-build.sh $GITHUB_WORKSPACE $VERSION ${{ matrix.suffix }} tar.gz

      - name: Setup MSYS2 UCRT64
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-libtool
            autoconf
            automake
            git
            patch
            zip
            perl
            nasm

      - name: Build Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          VERSION=${{ needs.check-version.outputs.new_version }}
          # 创建 mingw32-make 的别名 make
          ln -sf /ucrt64/bin/mingw32-make.exe /ucrt64/bin/make.exe
          git clone --depth=1 --recursive -b openssl-3.6.3 https://github.com/openssl/openssl.git
          git clone --depth=1 -b release-$VERSION https://github.com/nginx/nginx.git

          git clone --depth=1 --recursive https://github.com/simplresty/ngx_devel_kit.git
          git clone --depth=1 --recursive https://github.com/openresty/set-misc-nginx-module.git
          git clone --depth=1 --recursive https://github.com/yaoweibin/ngx_http_substitutions_filter_module.git
          git clone --depth=1 --recursive https://github.com/atomx/nginx-http-auth-digest.git
          git clone --depth=1 --recursive https://github.com/openresty/headers-more-nginx-module.git
          git clone --depth=1 --recursive https://github.com/aperezdc/ngx-fancyindex.git
          git clone --depth=1 --recursive -b pcre2-10.42 https://github.com/PCRE2Project/pcre2.git
          git clone --depth=1 --recursive -b v1.3.2 https://github.com/madler/zlib.git
          cd pcre2
          ./autogen.sh
          cd ../nginx
          ./auto/configure \
            --with-cc=gcc \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --http-scgi-temp-path=temp/scgi_temp \
            --http-uwsgi-temp-path=temp/uwsgi_temp \
            --with-compat \
            --with-pcre=../pcre2 \
            --with-pcre-jit \
            --with-zlib=../zlib \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_realip_module \
            --with-http_auth_request_module \
            --with-http_addition_module \
            --with-http_gzip_static_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-stream \
            --with-debug \
            --with-stream_ssl_module \
            --with-stream_realip_module \
            --with-stream_ssl_preread_module \
            --with-http_secure_link_module \
            --with-http_gunzip_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_slice_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-openssl-opt=enable-tls1_3 \
            --with-openssl=../openssl \
            --with-openssl-opt='no-asm no-tests -D_WIN32_WINNT=0x0501' \
            --with-cc-opt="-I/ucrt64/include -I/ucrt64/include/libxml2 -I/ucrt64/include/libxslt -DFD_SETSIZE=32768" \
            --with-ld-opt="-L/ucrt64/lib" \
            --add-module=../ngx_devel_kit \
            --add-module=../set-misc-nginx-module \
            --add-module=../ngx_http_substitutions_filter_module \
            --add-module=../nginx-http-auth-digest \
            --add-module=../headers-more-nginx-module \
            --add-module=../ngx-fancyindex 
          mingw32-make -j$(nproc)
          # mingw32-make install
          # 修复 Windows 可执行文件扩展名
           mkdir -p /tmp/nginx
          if [ -f objs/nginx.exe ]; then
            \cp objs/nginx.exe /tmp/nginx/nginx.exe
          fi
           \cp -pdr conf /tmp/nginx/
           \cp -pdr docs/html /tmp/nginx/
          mkdir -p /tmp/nginx/logs
          mkdir -p /tmp/nginx/temp/client_body_temp
          mkdir -p /tmp/nginx/temp/proxy_temp
          mkdir -p /tmp/nginx/temp/fastcgi_temp
          mkdir -p /tmp/nginx/temp/scgi_temp
          mkdir -p /tmp/nginx/temp/uwsgi_temp
          ls /tmp/nginx/
          cd /tmp
          zip -r $GITHUB_WORKSPACE/nginx_${VERSION}_${{ matrix.suffix }}.zip nginx/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx_${{ needs.check-version.outputs.new_version }}_${{ matrix.suffix }}
          path: nginx_${{ needs.check-version.outputs.new_version }}_${{ matrix.suffix }}.*

  release:
    name: Create Release
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nginx_${{ needs.check-version.outputs.new_version }}_*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Nginx ${{ needs.check-version.outputs.new_version }}
          body: |
            Auto-built nginx ${{ needs.check-version.outputs.new_version }} binaries for multiple platforms.
            
            ## Included Modules
            - HTTP/3 (QUIC) support via OpenSSL 3.6.3 + nginx native HTTP/3 module (Windows excluded)
            - Lua scripting (LuaJIT + lua-nginx-module + resty-* ecosystem + cjson/dkjson + qist/waf) (Windows excluded)
            - Headers more
            - VTS (Virtual host traffic status)
            - And more...
            
            ## Platforms
            - CentOS 7 / glibc (amd64, arm64)
            - Alpine / musl (amd64, arm64)
            - macOS (amd64, arm64)
            - Windows (amd64) — no HTTP/3 (QUIC), no Lua
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
